# CI test gate (ADR-0016 / ADR-0017; ARCHITECTURE.md §CI/CD topology).
# Each gate is a separate job so it surfaces as its own required status check on the PR
# (vet / build / test / coverage / govulncheck), letting branch protection require each
# one individually. Every action is pinned to a full 40-char commit SHA (SECURITY.md F-15).
# No pull_request_target, no secrets: this is a read-only test gate.
name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Least privilege: the test gate only needs to read the checked-out tree.
permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
      # -race needs cgo/gcc; ubuntu-latest has it. Mandatory because the batch path
      # fans out goroutines (ADR-0006 / ADR-0017).
      - name: go test -race
        run: go test -race ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
      # Mirrors CONTEXT.md §Test discipline coverage_command: profile -> LCOV -> report.
      # gcov2lcov emits coverage.lcov (the coverage_report artifact); the 80% floor
      # (ADR-0017) is enforced off the same profile via `go tool cover -func`.
      - name: Coverage (LCOV + 80% floor)
        run: |
          set -euo pipefail
          go test -coverprofile=cover.out -covermode=atomic ./...
          go install github.com/jandelgado/gcov2lcov@latest
          "$(go env GOPATH)/bin/gcov2lcov" -infile=cover.out -outfile=coverage.lcov
          total="$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')"
          echo "Total line coverage: ${total}%"
          awk -v c="$total" 'BEGIN { exit (c + 0 < 80) ? 1 : 0 }' || {
            echo "::error::coverage ${total}% is below the 80% floor"
            exit 1
          }

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
      # SECURITY.md F-13: gating supply-chain scan. Covers the Go toolchain/stdlib even
      # with zero third-party deps; becomes a real dependency gate the moment one is added.
      - name: govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
